<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon US Electronics Profit & ROI Calculator (2026 Updated)</title>
    <meta name="description" content="Calculate your Amazon US FBA electronics product profit, margin, and ROI instantly. Up-to-date with 2026 referral fees and FBA shipping rates.">
    <meta name="keywords" content="Amazon US calculator, electronics profit calculator, Amazon FBA fee 2026, FBA margin calculator">
    
    <!-- 替换为国内大厂(字节跳动)极速 CDN，保证样式瞬间加载 -->
    <link rel="stylesheet" href="tailwind.css">
    <style>
        .blur-overlay { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Premium Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <span class="font-bold text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-orange-600">SellersTools Pro</span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs text-green-600 bg-green-50 px-2.5 py-1 rounded-full font-medium">● 2026 Live FBA Rates</span>
                <button onclick="showLicenseModal()" class="text-xs bg-gray-900 hover:bg-gray-800 text-white px-3 py-1.5 rounded-lg font-medium transition">Activate PRO</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Input Form (Left 2 Columns) -->
        <section class="md:col-span-2 bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">亚马逊美国 FBA 利润计算器 <span class="text-orange-500 text-lg">(电子产品类目)</span></h1>
            
            <div class="space-y-6">
                <!-- Pricing Section -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">1. 定价与成本</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">售价 ($)</label>
                            <input type="number" id="sellingPrice" value="49.99" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">产品成本 / 前进货价 ($)</label>
                            <input type="number" id="productCost" value="12.50" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        </div>
                    </div>
                </div>

                <!-- Logistics Section -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">2. 物流与运输</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">寄往 FBA 仓库运费 ($/单位)</label>
                            <input type="number" id="shippingCost" value="3.20" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">FBA 履约费 / 配送费 ($/单位)</label>
                            <input type="number" id="fbaFee" value="5.40" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        </div>
                    </div>
                </div>

                <!-- Marketing Section -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">3. 市场营销与广告 (可选)</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">预计每单位 PPC 广告成本 ($)</label>
                            <input type="number" id="ppcCost" value="4.50" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        </div>
                    </div>
                </div>

                <button onclick="calculateProfit()" class="w-full bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-600 hover:to-orange-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition transform active:scale-95">
                    计算投资回报率和利润
                </button>
            </div>
        </section>

        <!-- Output Results (Right 1 Column) -->
        <section class="bg-gray-900 text-white rounded-2xl p-6 shadow-xl flex flex-col justify-between relative overflow-hidden">
            <div>
                <h2 class="text-lg font-bold tracking-tight text-gray-300 mb-6">财务摘要</h2>
                
                <div class="space-y-4">
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">亚马逊推荐费 (8%)</span>
                        <span id="referralFeeDisplay" class="font-medium">$4.00</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">总开销</span>
                        <span id="totalExpensesDisplay" class="font-medium">$29.60</span>
                    </div>
                    <div class="flex justify-between pt-2">
                        <span class="text-gray-200 font-semibold text-lg">净利润</span>
                        <span id="netProfitDisplay" class="text-2xl font-bold text-green-400">$20.39</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">净利差</span>
                        <span id="marginDisplay" class="font-medium text-green-400">40.79%</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">投资回报率 (ROI)</span>
                        <span id="roiDisplay" class="font-medium text-green-400">163.12%</span>
                    </div>
                </div>
            </div>

            <!-- Paywall Feature Button -->
            <div class="mt-8 pt-6 border-t border-gray-800">
                <button onclick="triggerPaywallAction()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg">
                    <span>📊</span>
                    <span>导出高级版 PDF 报告</span>
                </button>
                <p class="text-center text-xs text-gray-500 mt-2">🔒 专业功能。需要激活密钥。</p>
            </div>
        </section>
    </main>

    <!-- Paywall Modal Dialog -->
    <div id="paywallModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950 bg-opacity-60 blur-overlay">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-gray-100 text-gray-800">
            <button onclick="closePaywallModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl" style="background:none; border:none; cursor:pointer;">&times;</button>
            
            <div class="text-center mb-6">
                <span class="text-4xl">💎</span>
                <h3 class="text-xl font-bold text-gray-900 mt-2">解锁高级导出器</h3>
                <p class="text-sm text-gray-500 mt-1">导出定制的专业PDF利润报告，用于您的供应商谈判。</p>
            </div>

            <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-200">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-gray-900">终身专业访问权</p>
                        <p class="text-xs text-gray-500">一次性付款。包含所有300+计算器网络。</p>
                    </div>
                    <p class="text-2xl font-black text-gray-900">4.99美元</p>
                </div>
                <a href="https://lemonsqueezy.com" target="_blank" class="block text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-lg mt-4 transition shadow-sm">
                    立即购买许可证密钥
                </a>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">已经购买了？输入许可证密钥</label>
                <div class="flex space-x-2">
                    <input type="text" id="licenseKeyInput" placeholder="LK-XXXX-XXXX" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm uppercase outline-none focus:ring-2 focus:ring-orange-500">
                    <button onclick="verifyLicenseKey()" class="bg-gray-900 hover:bg-gray-800 text-white font-medium px-4 py-2 rounded-lg text-sm transition">激活</button>
                </div>
                <p id="verifyMessage" class="text-xs mt-1"></p>
            </div>
        </div>
    </div>

    <script>
        function calculateProfit() {
            const price = parseFloat(document.getElementById('sellingPrice').value) || 0;
            const cost = parseFloat(document.getElementById('productCost').value) || 0;
            const shipping = parseFloat(document.getElementById('shippingCost').value) || 0;
            const fbaFee = parseFloat(document.getElementById('fbaFee').value) || 0;
            const ppc = parseFloat(document.getElementById('ppcCost').value) || 0;

            let referralFee = 0;
            if (price <= 200) {
                referralFee = price * 0.08;
            } else {
                referralFee = (200 * 0.08) + ((price - 200) * 0.15);
            }

            const totalExpenses = cost + shipping + fbaFee + ppc + referralFee;
            const netProfit = price - totalExpenses;
            const margin = price > 0 ? (netProfit / price) * 100 : 0;
            const roi = (cost + shipping) > 0 ? (netProfit / (cost + shipping)) * 100 : 0;

            document.getElementById('referralFeeDisplay').innerText = '$' + referralFee.toFixed(2);
            document.getElementById('totalExpensesDisplay').innerText = '$' + totalExpenses.toFixed(2);
            document.getElementById('netProfitDisplay').innerText = '$' + netProfit.toFixed(2);
            document.getElementById('marginDisplay').innerText = margin.toFixed(2) + '%';
            document.getElementById('roiDisplay').innerText = roi.toFixed(2) + '%';

            if (netProfit >= 0) {
                document.getElementById('netProfitDisplay').className = "text-2xl font-bold text-green-400";
            } else {
                document.getElementById('netProfitDisplay').className = "text-2xl font-bold text-red-400";
            }
        }

        function triggerPaywallAction() {
            const isPro = localStorage.getItem('is_premium_user') === 'true';
            if (isPro) {
                alert('🎉 成功！正在生成并下载您的高级 PDF 报告... (模拟高级功能)');
            } else {
                showLicenseModal();
            }
        }

        function showLicenseModal() {
            document.getElementById('paywallModal').classList.remove('hidden');
        }

        function closePaywallModal() {
            document.getElementById('paywallModal').classList.add('hidden');
        }

        async function verifyLicenseKey() {
            const key = document.getElementById('licenseKeyInput').value.trim();
            const msgEl = document.getElementById('verifyMessage');
            if (!key) {
                msgEl.innerText = "请输入密钥。";
                msgEl.className = "text-xs text-red-500 mt-1";
                return;
            }
            msgEl.innerText = "正在验证...";
            msgEl.className = "text-xs text-yellow-600 mt-1";
            setTimeout(() => {
                if (key.toLowerCase() === "demo123") {
                    localStorage.setItem('is_premium_user', 'true');
                    msgEl.innerText = "✅ 激活成功！专业功能已解锁。";
                    msgEl.className = "text-xs text-green-600 mt-1";
                    setTimeout(() => { closePaywallModal(); }, 1500);
                } else {
                    msgEl.innerText = "❌ 密钥无效。测试请尝试输入 'demo123'。";
                    msgEl.className = "text-xs text-red-500 mt-1";
                }
            }, 800);
        }

        // 默认初始化执行一次
        calculateProfit();
    </script>
</body>
</html>
